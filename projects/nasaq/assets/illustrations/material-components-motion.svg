<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 512" role="img" aria-labelledby="title desc">
  <title id="title">Nasaq animated components</title>
  <desc id="desc">Buttons, switches, sliders, and status components demonstrate their interactive states.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#eee5fa"/><stop offset="1" stop-color="#c9b8ee"/></linearGradient><filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dy="12" stdDeviation="15" flood-color="#342343" flood-opacity=".15"/></filter><style>
    .button{animation:press 4s cubic-bezier(.2,.8,.2,1) infinite;transform-box:fill-box;transform-origin:center}.knob{animation:toggle 4s cubic-bezier(.2,.8,.2,1) infinite}.fill{animation:fill 5s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}.check{animation:check 4s ease-in-out infinite}.card-a{animation:float 6s ease-in-out infinite}.card-b{animation:float 6s -3s ease-in-out infinite}
    @keyframes press{0%,42%,62%,100%{transform:scale(1)}52%{transform:scale(.94)}}@keyframes toggle{0%,36%,100%{transform:translateX(0)}50%,82%{transform:translateX(54px)}}@keyframes fill{0%,100%{transform:scaleX(.25)}50%{transform:scaleX(.82)}}@keyframes check{0%,40%,100%{opacity:0;stroke-dashoffset:30}52%,82%{opacity:1;stroke-dashoffset:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @media(prefers-reduced-motion:reduce){.button,.knob,.fill,.check,.card-a,.card-b{animation:none}.check{opacity:1;stroke-dashoffset:0}}
  </style></defs>
  <rect width="768" height="512" rx="36" fill="url(#bg)"/>
  <g filter="url(#s)" transform="translate(76 82)"><g class="card-a"><rect width="294" height="348" rx="38" fill="#fbf8ff"/><text x="30" y="48" font-family="Inter,Arial" font-size="13" letter-spacing="1.6" fill="#6e6573">COMPONENT STATES</text><g class="button"><rect x="30" y="78" width="234" height="64" rx="32" fill="#6542bd"/><text x="147" y="118" text-anchor="middle" font-family="Inter,Arial" font-size="17" font-weight="600" fill="#fff">Save changes</text></g><rect x="30" y="177" width="102" height="52" rx="26" fill="#d9caef"/><circle class="knob" cx="56" cy="203" r="20" fill="#6947bc"/><rect x="30" y="269" width="234" height="12" rx="6" fill="#dfd6e9"/><rect class="fill" x="30" y="269" width="234" height="12" rx="6" fill="#7656c8"/><circle cx="51" cy="322" r="16" fill="#6542bd"/><path class="check" d="m43 322 6 6 11-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30"/></g></g>
  <g filter="url(#s)" transform="translate(398 128)"><g class="card-b"><rect width="294" height="256" rx="38" fill="#2b2532"/><text x="30" y="48" font-family="Inter,Arial" font-size="13" letter-spacing="1.6" fill="#cfbaf2">SAME CONTRACT</text><text x="30" y="105" font-family="Inter,Arial" font-size="24" font-weight="600" fill="#fff">Every state has</text><text x="30" y="137" font-family="Inter,Arial" font-size="24" font-weight="600" fill="#fff">a clear role.</text><rect x="30" y="174" width="112" height="45" rx="22" fill="#8061d4"/><circle cx="54" cy="196.5" r="7" fill="#fff"/><rect x="156" y="174" width="108" height="45" rx="22" fill="#453a4e"/><rect x="177" y="193" width="66" height="7" rx="4" fill="#a897b0"/></g></g>
</svg>
