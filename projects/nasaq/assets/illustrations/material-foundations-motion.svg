<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 512" role="img" aria-labelledby="title desc">
  <title id="title">Nasaq animated foundations</title>
  <desc id="desc">Color, spacing, radius, and typography tokens move into a shared foundation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f0ff"/><stop offset="1" stop-color="#d5c5f4"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8062dc"/><stop offset="1" stop-color="#5334ad"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dy="12" stdDeviation="14" flood-color="#39255d" flood-opacity=".14"/></filter>
    <style>
      .orbit{animation:orbit 14s linear infinite;transform-box:fill-box;transform-origin:center}.chip{animation:chip 4.8s cubic-bezier(.2,.8,.2,1) infinite}.chip:nth-child(2){animation-delay:-1.2s}.chip:nth-child(3){animation-delay:-2.4s}.chip:nth-child(4){animation-delay:-3.6s}.bar{animation:bar 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}.mark{animation:mark 5s cubic-bezier(.2,.8,.2,1) infinite;transform-box:fill-box;transform-origin:center}
      @keyframes orbit{to{transform:rotate(360deg)}}@keyframes chip{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes bar{0%,100%{transform:scaleX(.45)}50%{transform:scaleX(1)}}@keyframes mark{0%,76%,100%{transform:scale(1) rotate(0)}86%{transform:scale(1.08) rotate(5deg)}}
      @media(prefers-reduced-motion:reduce){.orbit,.chip,.bar,.mark{animation:none}}
    </style>
  </defs>
  <rect width="768" height="512" rx="36" fill="url(#bg)"/>
  <circle cx="384" cy="258" r="174" fill="none" stroke="#b29be4" stroke-width="2" stroke-dasharray="4 12"/>
  <g class="orbit">
    <circle cx="384" cy="84" r="11" fill="#6d4bc8"/><circle cx="558" cy="258" r="11" fill="#a5b28c"/><circle cx="384" cy="432" r="11" fill="#d9ad9f"/><circle cx="210" cy="258" r="11" fill="#3d314a"/>
  </g>
  <g filter="url(#shadow)"><rect x="246" y="120" width="276" height="276" rx="52" fill="#fbf8ff"/></g>
  <text x="278" y="163" font-family="Inter,Arial,sans-serif" font-size="13" letter-spacing="2" fill="#6d6472">FOUNDATIONS</text>
  <g transform="translate(335 190)"><g class="mark" fill="url(#core)"><rect width="38" height="38" rx="11"/><rect x="58" width="38" height="38" rx="11"/><rect y="58" width="38" height="38" rx="11"/><rect x="58" y="58" width="38" height="38" rx="11"/><rect x="32" y="32" width="32" height="32" rx="10"/></g></g>
  <g transform="translate(278 320)"><rect width="212" height="8" rx="4" fill="#e2d9ee"/><rect class="bar" width="212" height="8" rx="4" fill="#7555cf"/></g>
  <g transform="translate(82 74)"><g class="chip"><rect width="132" height="68" rx="22" fill="#2d2634"/><circle cx="31" cy="34" r="14" fill="#c9b3ff"/><text x="55" y="39" font-family="Inter,Arial" font-size="13" fill="#fff">COLOR</text></g><g transform="translate(474 18)"><g class="chip"><rect width="132" height="68" rx="22" fill="#fff"/><text x="25" y="43" font-family="Inter,Arial" font-size="26" fill="#49365c">Aa / أب</text></g></g><g transform="translate(12 310)"><g class="chip"><rect width="132" height="68" rx="22" fill="#fff"/><rect x="24" y="19" width="25" height="30" rx="8" fill="#8062dc"/><rect x="58" y="19" width="50" height="30" rx="8" fill="#c5b4e8"/></g></g><g transform="translate(492 324)"><g class="chip"><rect width="132" height="68" rx="22" fill="#5d3f8f"/><rect x="22" y="22" width="24" height="24" rx="6" fill="#fff"/><rect x="54" y="22" width="54" height="24" rx="12" fill="#bda8e9"/></g></g></g>
</svg>
