<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 512" role="img" aria-labelledby="title desc">
  <title id="title">Nasaq animated bidirectional layout</title>
  <desc id="desc">The same interface moves between left-to-right and right-to-left reading directions.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#e7ddf7"/><stop offset="1" stop-color="#bca5e6"/></linearGradient><filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dy="12" stdDeviation="16" flood-color="#2f1d47" flood-opacity=".16"/></filter><style>
    .left{animation:left 7s cubic-bezier(.2,.8,.2,1) infinite}.right{animation:right 7s cubic-bezier(.2,.8,.2,1) infinite}.traveler{animation:travel 7s cubic-bezier(.2,.8,.2,1) infinite}.line{animation:line 7s ease-in-out infinite;stroke-dasharray:12 10;stroke-dashoffset:0}
    @keyframes left{0%,42%,100%{transform:translateX(0);opacity:1}58%,84%{transform:translateX(54px);opacity:.45}}@keyframes right{0%,42%,100%{transform:translateX(0);opacity:.45}58%,84%{transform:translateX(-54px);opacity:1}}@keyframes travel{0%,18%,100%{transform:translateX(0)}58%,84%{transform:translateX(352px)}}@keyframes line{50%{stroke-dashoffset:-90}}
    @media(prefers-reduced-motion:reduce){.left,.right,.traveler,.line{animation:none}}
  </style></defs>
  <rect width="768" height="512" rx="36" fill="url(#bg)"/>
  <path class="line" d="M194 256H574" fill="none" stroke="#6d4fc2" stroke-width="3"/>
  <g filter="url(#s)" transform="translate(72 88)"><g class="left"><rect width="280" height="336" rx="38" fill="#fbf8ff"/><text x="28" y="48" font-family="Inter,Arial" font-size="13" letter-spacing="1.6" fill="#6e6573">LEFT TO RIGHT</text><circle cx="54" cy="96" r="22" fill="#6a49c1"/><rect x="88" y="82" width="132" height="12" rx="6" fill="#3b3045"/><rect x="88" y="104" width="92" height="9" rx="5" fill="#c5b8cf"/><rect x="28" y="152" width="224" height="72" rx="22" fill="#ece5f5"/><rect x="48" y="174" width="124" height="11" rx="6" fill="#7355c6"/><rect x="48" y="195" width="176" height="8" rx="4" fill="#b8a9c7"/><rect x="28" y="248" width="224" height="58" rx="29" fill="#6542bd"/><text x="140" y="284" text-anchor="middle" font-family="Inter,Arial" font-size="16" fill="#fff">Continue</text></g></g>
  <g filter="url(#s)" transform="translate(416 88)"><g class="right"><rect width="280" height="336" rx="38" fill="#2c2633"/><text x="252" y="48" text-anchor="end" font-family="Arial" font-size="13" letter-spacing="1" fill="#d6c2f5">من اليمين إلى اليسار</text><circle cx="226" cy="96" r="22" fill="#bca6e9"/><rect x="60" y="82" width="132" height="12" rx="6" fill="#f5effb"/><rect x="100" y="104" width="92" height="9" rx="5" fill="#8f819a"/><rect x="28" y="152" width="224" height="72" rx="22" fill="#463c50"/><rect x="108" y="174" width="124" height="11" rx="6" fill="#c3acef"/><rect x="56" y="195" width="176" height="8" rx="4" fill="#82748d"/><rect x="28" y="248" width="224" height="58" rx="29" fill="#a98de1"/><text x="140" y="285" text-anchor="middle" font-family="Arial" font-size="17" fill="#261d30">متابعة</text></g></g>
  <g transform="translate(181 242)"><g class="traveler"><circle r="15" fill="#fff"/><path d="m-5 0 4 4 7-9" fill="none" stroke="#6542bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</svg>
