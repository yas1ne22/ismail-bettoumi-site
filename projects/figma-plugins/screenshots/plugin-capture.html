<!doctype html>

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252529;background:#e6e7eb}.figma{height:100vh;display:grid;grid-template-rows:48px 1fr}.top{display:flex;align-items:center;padding:0 18px;background:#262629;color:#ededf0;font-size:12px}.dots{display:flex;gap:7px;margin-right:22px}.dots i{width:10px;height:10px;border-radius:50%;background:#ef6b70}.dots i:nth-child(2){background:#f0bc4e}.dots i:nth-child(3){background:#61c783}.file{font-weight:650}.workspace{display:grid;grid-template-columns:190px 1fr 330px;min-height:0}.layers,.properties{background:#fff}.layers{border-right:1px solid #d6d7dc;padding:20px 15px}.properties{border-left:1px solid #d6d7dc;padding:20px}.label{font-size:11px;font-weight:750;margin-bottom:20px}.layer{font-size:11px;color:#676770;padding:8px 9px;border-radius:5px}.layer.active{background:#e9e6ff;color:#5542c0}.canvas{position:relative;overflow:hidden;background-color:#e1e2e6;background-image:linear-gradient(#d6d7db 1px,transparent 1px),linear-gradient(90deg,#d6d7db 1px,transparent 1px);background-size:42px 42px}.artboard{position:absolute;left:50%;top:50%;width:390px;height:300px;transform:translate(-57%,-50%);border:2px solid #8d77e7;background:#fff;box-shadow:0 12px 30px #27283720}.artbar{height:56px;background:#f0eff6;padding:19px 22px;font-size:13px;font-weight:750}.artline{height:10px;margin:20px 24px 0;border-radius:8px;background:#dedee6}.artline.short{width:46%}.artline.long{width:72%}.artbutton{width:122px;height:40px;margin:42px 24px;background:#6753db;border-radius:8px}.properties p{height:9px;border-radius:6px;background:#dedfe3;margin:16px 0}.properties p:nth-child(3){width:70%}.plugin{position:absolute;z-index:2;right:28px;top:50%;width:320px;transform:translateY(-50%);border-radius:12px;background:#fff;box-shadow:0 25px 75px #11132348;overflow:hidden;border:1px solid #d8d9de}.plugin-head{height:48px;border-bottom:1px solid #e5e5e9;display:flex;align-items:center;gap:9px;padding:0 15px;font-size:12px;font-weight:720}.plugin-icon{width:23px;height:23px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800}.plugin-body{padding:18px}.intro{display:grid;gap:5px;padding-bottom:15px}.intro strong{font-size:13px}.intro span{color:#707078;font-size:10.5px;line-height:1.45}.field{margin:13px 0}.field label{display:block;margin-bottom:6px;font-size:10px;font-weight:650}.control{height:32px;border:1px solid #d8d8de;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px;background:#fbfbfc}.seg{display:flex;background:#efeff2;padding:2px;border-radius:6px}.seg b,.seg span{flex:1;text-align:center;padding:6px;border-radius:4px;font-size:10px}.seg b{background:white;box-shadow:0 1px 3px #19192519}.toggle{width:33px;height:19px;border-radius:12px;background:#d7d7dc;padding:3px}.toggle:after{content:'';display:block;width:13px;height:13px;border-radius:50%;background:#fff}.row{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:650}.context{margin-top:14px;padding:10px;border:1px solid #e3e3e7;border-radius:6px;background:#f7f7f9;font-size:10px}.context strong{display:block;margin-bottom:3px}.context span{color:#74747c}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:13px;color:#707078;font-size:9px}.checks span:before{content:var(--mark);color:var(--accent);margin-right:4px}.plugin-foot{height:58px;border-top:1px solid #e5e5e9;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.status{font-size:9px;color:#73737b}.run{border:0;border-radius:6px;background:var(--accent);color:#fff;padding:10px 12px;font-size:9px;font-weight:750}.run[disabled]{opacity:.48}.doctor{--accent:#18987a;--mark:'✦'}.handoff{--accent:#6651d8;--mark:'✓'}.report-mode .artboard,.report-mode .plugin{display:none}.report{display:none;position:absolute;left:50%;top:50%;width:650px;transform:translate(-50%,-50%);padding:32px;border:1px solid #d8d9df;border-radius:18px;background:#fff;box-shadow:0 22px 70px #1113232f}.report-mode .report{display:block}.report-kicker{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.12em}.report h1{margin:8px 0 5px;font-size:25px;letter-spacing:-.035em}.report-sub{color:#75757d;font-size:11px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:22px 0}.summary div{padding:14px;border:1px solid #e3e3e7;border-radius:10px}.summary span{display:block;color:#7c7c84;font-size:9px}.summary strong{display:block;margin-top:7px;font-size:20px}.report h2{font-size:12px;margin:0 0 10px}.finding{display:grid;grid-template-columns:72px 1fr 100px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #ececf0;font-size:10px}.severity{width:max-content;padding:5px 7px;border-radius:5px;background:#fff0ee;color:#b84738;font-size:8px;font-weight:800}.severity.med{background:#fff6dd;color:#9b6d05}.finding strong{display:block;margin-bottom:3px;font-size:11px}.finding small{color:#7c7c84}.path{text-align:right;color:#777780}.report-foot{margin-top:13px;padding-top:12px;border-top:1px solid #ececf0;color:#85858d;font-size:9px}.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 13px;border-radius:7px;background:#242428;color:#fff;font-size:10px;box-shadow:0 6px 20px #1115}
</style>
</head>
<body><div class="figma"><div class="top"><div class="dots"><i></i><i></i><i></i></div><span class="file">Product workspace · Figma Design</span></div><div class="workspace"><aside class="layers"><div class="label">Layers</div><div class="layer">⌄ Product page</div><div class="layer">▣ Header</div><div class="layer active">▣ Checkout card</div><div class="layer">T Button label</div><div class="layer">◇ Action button</div></aside><main class="canvas" id="canvas"><div class="artboard"><div class="artbar">Checkout</div><div class="artline long"></div><div class="artline short"></div><div class="artbutton"></div></div><div class="plugin" id="plugin"></div><div class="report" id="report"></div></main><aside class="properties"><div class="label">Design</div><p></p><p></p><p></p><p></p></aside></div></div>
<script>
const params=new URLSearchParams(location.search);const doctor=params.get('plugin')==='doctor';const state=params.get('state')||'setup';document.body.className=doctor?'doctor':'handoff';
const foot=(ready,working,button)=>`<div class="plugin-foot"><span class="status">${state==='running'?working:ready}</span><button class="run" ${state==='running'?'disabled':''}>${state==='running'?(doctor?'Examining…':'Working…'):button}</button></div>`;
document.querySelector('#plugin').innerHTML=doctor?`<div class="plugin-head"><span class="plugin-icon">✦</span>Design System Doctor</div><div class="plugin-body"><div class="intro"><strong>Diagnose system drift</strong><span>Inspect the work, prioritize inconsistencies, and create a treatment report without changing source layers.</span></div><div class="field"><label>Diagnosis scope</label><div class="control">Selection <span>⌄</span></div></div><div class="field"><label>Diagnosis depth</label><div class="seg"><b>Balanced</b><span>Strict</span></div></div><div class="field row"><label>Include hidden layers</label><span class="toggle"></span></div><div class="field"><label>Maximum findings</label><div class="control">80 <span>− &nbsp; +</span></div></div><div class="context"><strong>1 selected · Product page</strong><span>Checkout card</span></div><div class="checks"><span>Color tokens</span><span>Spacing tokens</span><span>Typography</span><span>Components</span><span>Auto layout</span><span>Naming</span></div></div>${foot('Ready to diagnose','Starting diagnosis…','Create diagnosis report')}`:`<div class="plugin-head"><span class="plugin-icon">→</span>Design Handoff Built</div><div class="plugin-body"><div class="intro"><strong>Audit before you hand off</strong><span>Scan layers, surface delivery risks, and create a structured report beside the work.</span></div><div class="field"><label>Audit scope</label><div class="seg"><b>Selection</b><span>Current page</span></div></div><div class="field row"><label>Include hidden layers</label><span class="toggle"></span></div><div class="field"><label>Maximum findings</label><div class="control">60 <span>− &nbsp; +</span></div></div><div class="context"><strong>1 selected · Product page</strong><span>Checkout card</span></div><div class="checks"><span>Naming</span><span>Auto layout</span><span>Components</span><span>Typography</span><span>Touch targets</span><span>Hidden layers</span></div></div>${foot('Ready to audit','Scanning layers…','Create handoff report')}`;
if(state==='report'){document.querySelector('#canvas').classList.add('report-mode');document.querySelector('#report').innerHTML=doctor?`<div class="report-kicker">DESIGN SYSTEM DOCTOR · DIAGNOSIS</div><h1>Checkout card · System diagnosis</h1><div class="report-sub">Balanced review · 46 layers examined</div><div class="summary"><div><span>Health score</span><strong>74/100</strong></div><div><span>Critical</span><strong>1</strong></div><div><span>Review</span><strong>3</strong></div><div><span>Polish</span><strong>2</strong></div></div><h2>Diagnosis and prescriptions</h2><div class="finding"><span class="severity">CRITICAL</span><div><strong>Detached color value</strong><small>Replace the fill with the shared Surface / Brand token.</small></div><span class="path">Checkout / CTA</span></div><div class="finding"><span class="severity med">REVIEW</span><div><strong>Spacing outside the system</strong><small>Use the closest spacing token instead of 18 px.</small></div><span class="path">Checkout / Items</span></div><div class="finding"><span class="severity med">REVIEW</span><div><strong>Unlinked text style</strong><small>Connect this label to Body / Small / Medium.</small></div><span class="path">CTA / Label</span></div><div class="report-foot">Generated by Design System Doctor · Source layers were not modified</div>`:`<div class="report-kicker">DESIGN HANDOFF BUILT · AUDIT REPORT</div><h1>Checkout card · Handoff audit</h1><div class="report-sub">Selection audit · 34 layers scanned</div><div class="summary"><div><span>High priority</span><strong>1</strong></div><div><span>Medium</span><strong>2</strong></div><div><span>Low</span><strong>1</strong></div><div><span>Checks run</span><strong>6</strong></div></div><h2>Prioritized findings</h2><div class="finding"><span class="severity">HIGH</span><div><strong>Interaction target is too small</strong><small>Increase the icon button hit area before development.</small></div><span class="path">Header / Close</span></div><div class="finding"><span class="severity med">MEDIUM</span><div><strong>Container has manual layout</strong><small>Add auto layout so spacing behavior is explicit.</small></div><span class="path">Checkout / Items</span></div><div class="finding"><span class="severity med">MEDIUM</span><div><strong>Layer name needs context</strong><small>Rename “Frame 214” before handoff.</small></div><span class="path">Checkout / Footer</span></div><div class="report-foot">Generated by Design Handoff Built · Source layers were not modified</div>`;document.querySelector('#canvas').insertAdjacentHTML('beforeend',`<div class="toast">${doctor?'Diagnosis':'Handoff'} report created</div>`)}
</script></body></html>
